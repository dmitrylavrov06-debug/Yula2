<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>YULA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-width shop. Graphite sticky header, warm milk ground, white product surfaces, pink only for actions, yellow only for promo. 60/30/10. Light-only by choice (dark theme is stage 2 in the brief). */
:root{
  --bg:#F7F4EF; --paper:#FFFFFF; --ink:#111111; --ink2:#2B2926; --muted:#6F6A64; --line:#E6E0D7; --soft:#EFEAE2;
  --pink:#FF2E7E; --pink-deep:#D3135C; --blush:#FFE9F1;
  --butter:#FFE14D; --green:#0B7F55; --green-soft:#E1F2E9; --warn:#B4520B;
  --f-d:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-b:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --spring:cubic-bezier(.2,.9,.25,1.15); --out:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-b);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:460px;margin:0 auto;min-height:100vh;overflow-x:clip;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{animation:viewIn .25s var(--out)}
@keyframes viewIn{from{opacity:.4;transform:translateY(6px)}}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;padding-top:8px}
.r1{display:flex;align-items:center;gap:10px;height:34px}
.mark{font:900 20px var(--f-d);letter-spacing:.14em;display:flex;align-items:center;gap:6px}
.mark b{width:9px;height:9px;background:var(--pink);clip-path:polygon(0 0,100% 0,100% 70%,70% 100%,0 100%);display:inline-block}
.r1 .sp{flex:1}
.hb{width:36px;height:36px;display:grid;place-items:center;position:relative;color:#fff}
.hb svg.i{width:22px;height:22px}
.hb .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 2px var(--ink)}
.r2{display:flex;gap:8px;align-items:center;margin-top:6px}
.pill{flex:1;min-width:0;height:42px;background:#fff;border-radius:12px;display:flex;align-items:center;position:relative;overflow:hidden;color:var(--ink)}
.pill input{position:absolute;inset:0 88px 0 14px;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);z-index:2;width:auto}
.hint{position:absolute;left:14px;right:88px;top:11px;height:21px;overflow:hidden;color:var(--muted);pointer-events:none;z-index:1}
.hint span{position:absolute;left:0;top:0;white-space:nowrap;transition:transform .4s var(--spring),opacity .3s}
.hint span.out{transform:translateY(-110%);opacity:0}.hint span.in{transform:translateY(110%);opacity:0}
.pill.typing .hint{visibility:hidden}
.cam{position:absolute;right:50px;top:0;bottom:0;width:36px;display:grid;place-items:center;color:var(--ink2);z-index:3}
.cam svg.i{width:21px;height:21px}
.gos{position:absolute;right:4px;top:4px;bottom:4px;width:44px;border-radius:9px;background:var(--pink);color:#fff;display:grid;place-items:center;z-index:3}
.sugg{display:flex;gap:7px;flex-wrap:wrap;padding-top:10px}
.sugg small{width:100%;color:rgba(255,255,255,.6);font-size:12px}
.sugg button{border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600}
.ntabs{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;position:relative;padding-top:10px;padding-bottom:10px}
.ntabs::-webkit-scrollbar{display:none}
.nt{color:rgba(255,255,255,.62);font-weight:700;font-size:15px;flex:none;transition:color .2s}
.nt[aria-selected="true"]{color:#fff}
.ind{position:absolute;bottom:4px;height:3px;border-radius:3px;background:var(--pink);transition:left .3s var(--spring),width .3s var(--spring)}
.net{background:var(--warn);color:#fff;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;padding-block:8px}
.ecob{background:var(--soft);font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;gap:8px;align-items:center;padding-block:7px}

/* trust strip */
.trust{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding-block:11px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.trust::-webkit-scrollbar{display:none}
.trust span{display:flex;gap:6px;align-items:center;flex:none}
.trust svg.i{width:16px;height:16px;color:var(--green)}

/* hero */
.hero{position:relative;margin-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));border-radius:16px;overflow:hidden}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;height:196px;position:relative;overflow:hidden;display:block;width:100%;text-align:left}
.s1{background:repeating-conic-gradient(from 45deg,var(--pink) 0 25%,#FF4A91 0 50%) 0 0/36px 36px;color:#fff}
.rib{position:absolute;top:18px;left:-10px;transform:rotate(-6deg);background:var(--ink);color:#fff;font:800 11px var(--f-d);letter-spacing:.12em;padding:7px 18px 7px 24px}
.mega{position:absolute;left:16px;bottom:22px;font-family:var(--f-d);line-height:.82}
.mega small{display:block;font:900 19px var(--f-d);margin-bottom:6px}
.mega b{display:block;font-size:56px;font-weight:900;letter-spacing:-.04em;text-shadow:4px 4px 0 var(--ink)}
.stk{position:absolute;right:16px;top:30px;width:92px;height:92px;border-radius:50%;background:var(--butter);color:var(--ink);display:grid;place-items:center;text-align:center;font:900 10.5px/1.15 var(--f-d);box-shadow:0 0 0 3px var(--ink)}
.stk::before{content:"";position:absolute;inset:6px;border:2px dashed var(--ink);border-radius:50%;animation:spin 16s linear infinite}
.stk span{transform:rotate(10deg)}
.cta{position:absolute;right:16px;bottom:22px;background:#fff;color:var(--ink);font:800 10.5px var(--f-d);letter-spacing:.08em;padding:9px 13px;border-radius:999px;display:flex;gap:6px;align-items:center}
.cta em{font-style:normal;display:inline-block;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.s2{background:var(--blush);color:var(--ink)}
.s2 h3{position:absolute;left:16px;top:22px;margin:0;font:900 28px/.95 var(--f-d);letter-spacing:-.02em}
.s2 p{position:absolute;left:16px;bottom:22px;margin:0;font-size:13px;max-width:54%;color:var(--ink2)}
.s2 p b{display:block;font:900 16px var(--f-d);color:var(--pink-deep);margin-bottom:2px}
.duo{position:absolute;right:22px;top:46px;width:124px;height:86px}
.duo i{position:absolute;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:900 17px var(--f-d);font-style:normal;color:var(--ink);top:10px;box-shadow:0 0 0 3px var(--blush)}
.duo i:nth-child(1){left:0;background:var(--pink);color:#fff;animation:bob 2.8s ease-in-out infinite}
.duo i:nth-child(2){right:0;background:var(--butter);animation:bob 2.8s ease-in-out infinite .4s}
.duo i:nth-child(3){left:50%;top:30px;width:26px;height:26px;margin-left:-13px;background:var(--ink);color:#fff;font-size:15px;z-index:2}
@keyframes bob{50%{transform:translateY(-6px)}}
.s3{background:var(--ink);color:#fff}
.s3 h3{position:absolute;left:16px;top:22px;margin:0;font:900 27px/.95 var(--f-d);letter-spacing:-.02em}
.s3 p{position:absolute;left:16px;bottom:22px;margin:0;font-size:13px;color:rgba(255,255,255,.78);max-width:58%}
.spool{position:absolute;right:26px;top:36px;width:84px;height:120px}
.spool i{position:absolute;left:12px;top:10px;width:60px;height:92px;border-radius:10px;background:repeating-linear-gradient(0deg,var(--pink) 0 4px,#FF5C9B 4px 7px);animation:bob 3s ease-in-out infinite}
.spool i::before,.spool i::after{content:"";position:absolute;left:-8px;right:-8px;height:12px;border-radius:4px;background:#F2EDE4}
.spool i::before{top:-6px}.spool i::after{bottom:-6px}
.spool b{position:absolute;left:41px;top:102px;width:2.5px;height:46px;background:var(--pink);transform-origin:top;animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(16deg)}}
.slide .anim{transition:transform .55s var(--spring),opacity .45s}
.slide:not(.on) .anim{transform:translateY(16px) scale(.95);opacity:0}
.dots{position:absolute;bottom:9px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:6px;background:rgba(127,127,127,.45);overflow:hidden;position:relative;transition:width .3s var(--spring)}
.dots i.on{width:22px}
.dots i.on::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:fill 4.6s linear forwards}
.hero.paused .dots i.on::after{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}}

/* circles */
.circles{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:74px;gap:12px 8px;overflow-x:auto;scrollbar-width:none;padding-block:18px 4px}
.circles::-webkit-scrollbar{display:none}
.cc{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;text-align:center;line-height:1.15}
.ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;transition:transform .2s var(--spring)}
.cc:active .ring{transform:scale(.92)}
.ring svg{width:74%;height:74%;filter:drop-shadow(0 4px 4px rgba(0,0,0,.12))}

/* section heads */
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sh h3{margin:0;font:900 16px var(--f-d);letter-spacing:-.01em;display:flex;gap:8px;align-items:center}
.sh .more{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;gap:2px;align-items:center}
.tchips{display:flex;gap:3px;align-items:center;font:800 12px var(--f-d)}
.tchips b{background:var(--ink);color:#fff;border-radius:6px;padding:4px 5px;min-width:27px;text-align:center}
.hrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.hrow::-webkit-scrollbar{display:none}
.fc{flex:0 0 116px}
.fc .tile{aspect-ratio:3/4;border-radius:12px}
.fc .pr{margin-top:6px;font:800 15px var(--f-d)}
.fc .pr s{display:block;font:500 11px var(--f-b);color:var(--muted)}
.left{font-size:11.5px;font-weight:700;color:var(--pink-deep);margin-top:2px}
.lbar{height:4px;border-radius:4px;background:var(--soft);margin-top:4px;overflow:hidden}
.lbar i{display:block;height:100%;background:var(--pink);border-radius:4px}

.t3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.t3 button{position:relative}
.t3 .tile{aspect-ratio:3/4;border-radius:12px}
.rank{position:absolute;top:0;left:0;z-index:2;background:var(--butter);color:var(--ink);font:900 10px var(--f-d);padding:5px 8px;border-radius:12px 0 10px 0}
.t3 .pr{font:800 14px var(--f-d);margin-top:6px}
.t3 small{display:block;color:var(--muted);font-size:11px}

.gcard{flex:0 0 240px;display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:14px;padding:9px;text-align:left}
.gcard .tile{width:64px;height:76px;border-radius:9px;flex:none}
.gcard b{font:800 14px var(--f-d);color:var(--pink-deep)}
.gcard small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.av{display:flex}
.av i{width:22px;height:22px;border-radius:50%;border:2px solid var(--paper);display:grid;place-items:center;font:800 9px var(--f-b);font-style:normal;margin-right:-6px}

/* feed */
.ftabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,140px));z-index:15;background:var(--bg);padding-block:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:14px}
.ftabs::-webkit-scrollbar{display:none}
.ft{position:relative;z-index:2;padding:8px 13px;border-radius:999px;font-weight:700;font-size:13.5px;flex:none;transition:color .2s;background:var(--paper);display:flex;gap:5px;align-items:center}
.ft svg.i{width:15px;height:15px}
.ft[aria-selected="true"]{color:#fff;background:transparent}
.find{position:absolute;z-index:1;top:10px;height:calc(100% - 20px);border-radius:999px;background:var(--ink);transition:left .3s var(--spring),width .3s var(--spring)}
.tile{position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(120% 85% at 50% 28%,hsl(var(--h) 35% 98%),hsl(var(--h) 22% 89%))}
.tile::after{content:"";position:absolute;left:22%;right:22%;bottom:9%;height:7%;border-radius:50%;background:radial-gradient(closest-side,rgba(40,25,20,.2),transparent)}
.tile>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;background:var(--paper)}
.tile>svg{width:74%;height:74%;position:relative;z-index:1;filter:drop-shadow(0 8px 8px rgba(30,20,10,.15))}
.mas{columns:2;column-gap:8px}
.pc{break-inside:avoid;margin-bottom:12px;display:block;background:var(--paper);border-radius:12px;overflow:hidden;animation:cardIn .45s var(--spring) both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}}
.pc .tile{border-radius:0}
.bdgs{position:absolute;top:8px;left:8px;z-index:3;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.bdg{font:800 10.5px var(--f-b);padding:3px 6px;border-radius:5px;display:flex;gap:3px;align-items:center;letter-spacing:.01em}
.bdg svg.i{width:12px;height:12px;stroke-width:2.4}
.bdg.td{background:var(--ink);color:#fff}
.bdg.ua{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.bdg.vf{background:var(--green-soft);color:var(--green)}
.heart{position:absolute;top:7px;right:7px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;z-index:3;color:var(--ink)}
.heart svg.i{width:17px;height:17px}
.heart.on{color:var(--pink)}
.heart.on svg.i{fill:var(--pink);animation:pop .4s var(--spring)}
.heart.on::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--pink);animation:ring .45s ease-out forwards}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.3)}}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
.pbar{position:absolute;left:0;bottom:0;z-index:3;display:flex;align-items:center}
.pv{background:var(--ink);color:#fff;font:800 14.5px var(--f-d);padding:6px 9px 5px;border-radius:0 10px 0 0;letter-spacing:-.02em}
.off{background:var(--butter);color:var(--ink);font:800 11px var(--f-b);padding:2px 5px;border-radius:4px;margin-left:5px}
.add{position:absolute;right:7px;bottom:7px;z-index:3;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.add svg.i{width:18px;height:18px}
.pmeta{padding:8px 9px 10px}
.pn{font-size:13px;line-height:1.3;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ps{display:flex;gap:6px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.star{color:var(--ink);font-weight:700;display:inline-flex;gap:2px;align-items:center}
.star svg{width:12px;height:12px;fill:var(--ink)}
.newb{font-weight:800;color:var(--ink);background:var(--butter);border-radius:4px;padding:0 5px;font-size:11px}
.gchip{display:inline-flex;margin-top:6px;font-size:11.5px;font-weight:800;color:var(--pink-deep);background:var(--blush);padding:2px 7px;border-radius:5px}
.sentinel{height:40px;display:grid;place-items:center;color:var(--muted);font-size:12px}
.note{font-size:11.5px;color:var(--muted);text-align:center;padding-block:4px 16px}

/* tab bar */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,460px);background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));z-index:25}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);position:relative;padding-block:2px;min-height:48px;justify-content:center}
.tab svg.i{width:24px;height:24px;transition:transform .25s var(--spring)}
.tab[aria-current="page"]{color:var(--ink);font-weight:800}
.tab[aria-current="page"] svg.i{transform:translateY(-2px)}
.tab[aria-current="page"] .fl{fill:var(--ink)}
.cnt{position:absolute;top:0;left:calc(50% + 5px);background:var(--pink);color:#fff;font-size:10px;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.cnt.bump{animation:bump .45s var(--spring)}
@keyframes bump{40%{transform:scale(1.45)}}

/* catalog */
.catv{display:grid;grid-template-columns:104px minmax(0,1fr)}
.side{background:var(--soft);position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,140px));align-self:start;max-height:calc(100vh - 220px);overflow-y:auto;scrollbar-width:none}
.side button{display:block;width:100%;padding:13px 10px 13px 13px;font-size:13px;line-height:1.2;color:var(--ink2);position:relative}
.side button[aria-selected="true"]{background:var(--bg);font-weight:800;color:var(--ink)}
.side button[aria-selected="true"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--pink)}
.cmain{padding:4px 12px 20px;min-width:0}
.cmain h4{margin:14px 0 10px;font-size:15px;font-weight:800}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}
.cgrid .ring{width:100%;height:auto;aspect-ratio:1;max-width:84px}
.cgrid .all .ring{background:var(--paper)}
.cgrid .all svg.i{width:34%;height:34%;filter:none}
.cban{border-radius:14px;padding:14px;background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center;margin-top:18px;width:100%;gap:10px}
.cban b{display:block;font:900 14px/1.1 var(--f-d)}
.cban small{display:block;font-size:12px;opacity:.75;margin-top:4px}

/* listing */
.lhead{display:flex;align-items:center;gap:10px;padding-block:12px 2px}
.lhead h2{margin:0;font:900 18px var(--f-d);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{width:38px;height:38px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none}
.fchips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-block:10px 12px}
.fchips::-webkit-scrollbar{display:none}
.fch{flex:none;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;display:flex;gap:5px;align-items:center}
.fch[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.qnote{background:var(--paper);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--ink2);margin-bottom:10px}

/* common */
.ph{font:900 21px var(--f-d);margin:18px 0 4px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 14px;max-width:60ch;font-size:14px}
.card{background:var(--paper);border-radius:16px;padding:14px;margin-top:12px}
.card h4{margin:0 0 10px;font-size:15px;font-weight:800;display:flex;gap:8px;align-items:center}
.card h4 .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font:800 11px var(--f-d);display:grid;place-items:center}
.btn{border-radius:12px;padding:13px 16px;font-weight:800;background:var(--ink);color:#fff;transition:transform .12s;display:inline-flex;gap:6px;align-items:center;justify-content:center;min-height:48px}
.btn:active{transform:scale(.97)}
.btn.pink{background:var(--pink)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px;min-height:38px}
.btn.block{width:100%}
.btn:disabled{background:var(--soft);color:var(--muted);box-shadow:none}
.row{display:flex;gap:12px;align-items:flex-start;padding-block:12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tile{width:76px;height:94px;border-radius:10px;flex:none}
.row .info{flex:1;min-width:0}
.row .t{font-weight:600;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.row .pr{font:800 15px var(--f-d)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:9px;background:var(--soft);font-weight:800;font-size:16px}
.sum{display:flex;justify-content:space-between;padding:4px 0;gap:10px;font-size:14px}
.sum.total{font-weight:800;font-size:17px;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.minus{color:var(--green);font-weight:700}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:10px}
label.f input,select.f{display:block;width:100%;margin-top:4px;padding:12px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:has(input:checked){border-color:var(--ink);background:var(--bg)}
.opt:has(input:disabled){opacity:.55;cursor:not-allowed}
.opt input{accent-color:var(--ink);margin-top:3px;flex:none}
.opt .ot{flex:1;min-width:0}
.opt b{font-size:14px}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.opt .tag{font-size:11px;font-weight:800;color:var(--green);background:var(--green-soft);border-radius:5px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{border-radius:9px;padding:9px 4px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button small{font-size:11px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.err{color:var(--pink-deep);font-size:13px;font-weight:700;min-height:18px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink2);margin:10px 0}
.chk input{width:20px;height:20px;accent-color:var(--ink);flex:none;margin:0}
.chk a{color:var(--ink);font-weight:700}
.prog{background:var(--paper);border-radius:14px;padding:12px 14px;margin-top:12px;position:relative}
.prog .tt{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.prog .bar{height:8px;border-radius:8px;background:var(--soft);margin-top:8px;overflow:hidden}
.prog .bar i{display:block;height:100%;border-radius:8px;background:var(--ink);transition:width .6s var(--spring)}
.prog.done .bar i{background:var(--green)}
.shop{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:800;padding-top:4px}
.shop small{font-weight:600;color:var(--muted);margin-left:auto;display:flex;gap:4px;align-items:center}
.shop small.today{color:var(--green)}
.sw2{position:relative;width:46px;height:28px;border-radius:999px;background:var(--line);flex:none;transition:background .2s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--spring)}
.sw2[aria-checked="true"]{background:var(--ink)}
.sw2[aria-checked="true"]::after{transform:translateX(18px)}
.line{display:flex;align-items:center;gap:12px;padding-block:13px;border-bottom:1px solid var(--line);width:100%;font-size:14.5px}
.line:last-child{border-bottom:0}
.line .ic{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none}
.line .tx{flex:1;min-width:0}
.line .tx small{display:block;color:var(--muted);font-size:12.5px}
.line>svg.i:last-child{color:var(--muted)}
.line:disabled{opacity:.55}
.empty{text-align:center;color:var(--muted);padding:44px 10px}
.empty .bigi{font:900 40px var(--f-d);color:var(--line)}
.link{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:11px;padding:7px 7px 7px 12px;margin-top:10px;overflow:hidden}
.link code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 13.5px ui-monospace,monospace}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.coupon{display:flex;justify-content:space-between;align-items:center;background:var(--green-soft);color:var(--green);font-weight:800;border-radius:12px;padding:11px 13px;margin-top:12px;font-size:13.5px;gap:8px}
.drum{display:flex;gap:12px;align-items:center;width:100%;margin-top:12px;background:var(--butter);border-radius:14px;padding:12px}
.drum i{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:conic-gradient(var(--pink) 0 60deg,#fff 0 120deg,var(--ink) 0 180deg,#fff 0 240deg,var(--pink) 0 300deg,#fff 0);animation:spin 6s linear infinite;flex:none}
.drum b{display:block;font-size:14px}
.drum small{font-size:12.5px;color:var(--ink2)}
.prof{display:flex;align-items:center;gap:12px;padding:16px;border-radius:18px;background:var(--ink);color:#fff;margin-top:16px}
.ava{width:54px;height:54px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font:900 15px var(--f-d);flex:none}
.prof .bal{margin-left:auto;text-align:right}
.prof .bal b{display:block;font:900 20px var(--f-d)}
.prof .bal small{opacity:.7;font-size:12px}
.fund .bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;margin-top:8px}
.fund .bar i{display:block;height:100%;background:var(--ink);border-radius:8px}

/* tracking */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:26px 1fr;gap:10px;position:relative;padding-bottom:16px}
.tl li::before{content:"";position:absolute;left:12px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li.done::before{background:var(--ink)}
.tl .d{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;color:#fff}
.tl li.done .d{background:var(--ink);border-color:var(--ink)}
.tl li.cur .d{border-color:var(--pink);background:var(--pink);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,46,126,.18)}}
.tl .d svg.i{width:14px;height:14px;stroke-width:3}
.tl b{font-size:14.5px}
.tl small{display:block;color:var(--muted);font-size:12.5px}
.tl li:not(.done):not(.cur) b{color:var(--muted);font-weight:600}
.code{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}
.code b{font:900 24px var(--f-d);background:var(--bg);border-radius:10px;width:42px;height:54px;display:grid;place-items:center}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(17,12,8,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--paper);width:min(100%,460px);max-height:94vh;overflow-y:auto;overscroll-behavior:contain;border-radius:22px 22px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:up .38s var(--spring);position:relative}
.sheet.small{max-height:84vh}
@keyframes up{from{transform:translateY(50%)}}
.in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:10px auto 6px}
.x{position:absolute;top:12px;right:12px;z-index:6;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.gal{position:relative}
.gtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gtrack::-webkit-scrollbar{display:none}
.frame{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:1/1;max-width:100%;position:relative}
.frame .tile{width:100%;height:100%}
.frame .tile>svg{width:60%;height:60%}
.frame.back .tile>svg{transform:scaleX(-1)}
.frame.photo .tile>img{object-fit:contain;background:var(--paper)}
.frame.photo .tile::after{display:none}
.frame.zoom .tile>svg{transform:scale(2.7) translateY(6%);filter:none}
.frame.zoom .tile::after{display:none}
.lab{position:absolute;left:12px;bottom:12px;z-index:3;background:rgba(255,255,255,.92);font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}
.gcount{position:absolute;right:12px;bottom:12px;z-index:3;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}
.tagcard{width:100%;height:100%;display:grid;place-items:center;background:var(--soft)}
.tagcard div{background:#fff;width:58%;padding:18px 16px;border-radius:6px;box-shadow:0 10px 24px rgba(0,0,0,.08);font-size:12px;line-height:1.5;position:relative}
.tagcard div::before{content:"";position:absolute;top:10px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line)}
.tagcard b{display:block;font:900 13px var(--f-d);margin:12px 0 6px;letter-spacing:.1em}
.dp{display:flex;align-items:baseline;gap:8px;margin-top:14px;flex-wrap:wrap}
.dp b{font:900 26px var(--f-d);letter-spacing:-.02em}
.dp s{color:var(--muted)}
.parts{font-size:13px;color:var(--ink2);margin-top:2px}
.parts b{font-weight:800}
.dname{font-size:15.5px;margin:6px 0 0;line-height:1.35}
.bline{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.bline .bdg{font-size:12px;padding:4px 8px;border-radius:7px}
.cut{display:flex;gap:8px;align-items:center;background:var(--green-soft);color:var(--green);border-radius:11px;padding:9px 12px;font-size:13px;font-weight:700;margin-top:12px}
.lbl{font-weight:800;font-size:14px;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl span{color:var(--muted);font-weight:500;font-size:13px}
.lbl button{font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.sws{display:flex;gap:10px}
.sws button{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 3px #fff;border:2px solid var(--line);transition:transform .2s var(--spring)}
.sws button[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.08)}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:700;min-width:52px;min-height:44px;position:relative;transition:all .15s}
.size[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.size.oos{color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 6px,var(--soft) 6px 7px);text-decoration:line-through}
.size .few{position:absolute;top:-8px;right:-6px;background:var(--pink);color:#fff;font-size:9.5px;font-weight:800;padding:1px 4px;border-radius:4px;text-decoration:none}
.size .rec{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);background:var(--butter);color:var(--ink);font-size:9px;font-weight:800;padding:0 4px;border-radius:4px;white-space:nowrap}
.yula{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:14px;width:100%}
.yula .ya{width:34px;height:34px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font:900 12px var(--f-d);flex:none}
.yula b{font-size:13.5px;display:block}
.yula small{font-size:12.5px;color:var(--muted)}
.fit{margin-top:4px}
.fit .scale{position:relative;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--soft),var(--line) 50%,var(--soft));margin:10px 0 6px}
.fit .mk{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transform:translate(-50%,-50%)}
.fit .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.blk{border-top:1px solid var(--line);padding-block:16px;margin-top:16px}
.blk h5{margin:0 0 10px;font-size:15px;font-weight:800}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.seller{display:flex;gap:12px;align-items:center}
.seller .lg{width:46px;height:46px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font:900 14px var(--f-d);flex:none}
.seller small{display:block;color:var(--muted);font-size:12.5px}
.sstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sstats div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.sstats b{display:block;font:800 14px var(--f-d)}
.sstats small{font-size:11px;color:var(--muted)}
.rsum{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.rsum .big{font:900 34px var(--f-d)}
.rbars{display:grid;gap:3px;font-size:11.5px;color:var(--muted)}
.rbars div{display:grid;grid-template-columns:10px 1fr 30px;gap:6px;align-items:center}
.rbars i{height:5px;border-radius:5px;background:var(--soft);overflow:hidden;display:block}
.rbars i b{display:block;height:100%;background:var(--ink)}
.rv{padding-block:12px;border-top:1px solid var(--line)}
.rv .h{display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}
.rv .h b{font-weight:800}
.rv .h .ok{color:var(--green);font-weight:700;font-size:12px;display:flex;gap:3px;align-items:center}
.rv .m{font-size:12px;color:var(--muted);margin-top:2px}
.rv p{margin:6px 0 0;font-size:13.5px}
.buybar{position:sticky;bottom:0;background:var(--paper);padding-top:10px;display:grid;grid-template-columns:1fr 1.25fr;gap:8px;border-top:1px solid var(--line);z-index:4}
.buybar .btn{flex-direction:column;gap:0;padding:8px}
.buybar .btn b{font:800 14.5px var(--f-d)}
.buybar .btn span{font-size:11.5px;font-weight:600;opacity:.85}
.stable{overflow-x:auto;margin-top:8px}
.stable table{border-collapse:collapse;width:100%;font-size:13px;min-width:300px}
.stable th,.stable td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
.stable th{font-weight:800;background:var(--bg)}
.stable td:first-child,.stable th:first-child{text-align:left;font-weight:700}
.rng{width:100%;accent-color:var(--ink)}
.rlab{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-top:14px}
.result{background:var(--ink);color:#fff;border-radius:16px;padding:16px;margin-top:14px;animation:viewIn .3s var(--out)}
.result b{font:900 30px var(--f-d);color:var(--butter)}
.result small{display:block;opacity:.8;font-size:12.5px;margin-top:4px}

/* drum wheel */
.wheelwrap{position:relative;width:min(270px,74vw);aspect-ratio:1;max-width:100%;margin:12px auto 14px}
.wheel{width:100%;height:100%;border-radius:50%;border:7px solid var(--ink);position:relative;transition:transform 4.4s cubic-bezier(.15,.7,.1,1)}
.wheel span{position:absolute;left:50%;top:50%;width:46%;transform-origin:0 50%;font:800 12px var(--f-d);text-align:right;padding-right:12px;margin-top:-9px;line-height:18px}
.ptr{position:absolute;top:-12px;left:50%;transform:translateX(-50%);border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--ink);z-index:2}
.hub{position:absolute;inset:37%;border-radius:50%;background:var(--butter);border:5px solid var(--ink);display:grid;place-items:center;font:900 11px var(--f-d);letter-spacing:.08em}
.odds{font-size:12.5px;color:var(--muted);margin-top:12px}
.odds summary{cursor:pointer;font-weight:700;color:var(--ink)}
.odds table{width:100%;border-collapse:collapse;margin-top:6px}
.odds td{padding:4px 0;border-bottom:1px solid var(--line)}
.odds td:last-child{text-align:right}

/* onboarding */
.onb{position:fixed;inset:0;z-index:80;background:var(--ink);color:#fff;overflow-y:auto;padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.onb .wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;min-height:100%;gap:18px}
.onb .big{font:900 56px/.9 var(--f-d);letter-spacing:.06em;display:flex;align-items:center;gap:10px;animation:rise .6s var(--spring) both}
.onb .big b{width:20px;height:20px;background:var(--pink);clip-path:polygon(0 0,100% 0,100% 70%,70% 100%,0 100%)}
.onb .tag{font-size:20px;line-height:1.25;font-weight:600;max-width:20ch;animation:rise .6s var(--spring) .08s both}
.onb ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.onb li{display:flex;gap:12px;align-items:center;font-size:15px;animation:rise .55s var(--spring) both}
.onb li:nth-child(1){animation-delay:.16s}.onb li:nth-child(2){animation-delay:.22s}.onb li:nth-child(3){animation-delay:.28s}
.onb li i{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.onb li i svg.i{color:var(--butter)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.onb .who{display:flex;flex-wrap:wrap;gap:8px}
.onb .who button{border:1.5px solid rgba(255,255,255,.3);border-radius:999px;padding:9px 15px;font-weight:700}
.onb .who button[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff}
.onb .gift{display:flex;gap:12px;align-items:center;background:var(--pink);border-radius:16px;padding:14px;transform:rotate(-1.5deg)}
.onb .gift b{font:900 26px var(--f-d)}
.onb .juli{display:flex;gap:10px;align-items:center;font-size:13.5px;color:rgba(255,255,255,.78)}
.onb .juli .ya{width:36px;height:36px;border-radius:50%;background:var(--butter);color:var(--ink);display:grid;place-items:center;font:900 12px var(--f-d);flex:none}
.onb .btn{background:#fff;color:var(--ink);margin-top:auto}

.fly{position:fixed;z-index:60;width:66px;height:66px;border-radius:50%;pointer-events:none;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.fly>svg{width:80%;height:80%}
.conf{position:fixed;width:7px;height:11px;z-index:61;pointer-events:none;border-radius:2px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:13px;font-weight:700;font-size:13.5px;z-index:90;max-width:calc(100% - 32px);text-align:center;animation:toast .3s var(--spring)}
@keyframes toast{from{transform:translate(-50%,18px);opacity:0}}
.eco *,.eco *::before,.eco *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

function totals(pay){
  const sub=S.cart.reduce((a,x)=>a+(x.group?P[x.i].g:P[x.i].p)*x.q,0);let disc=0;const c=S.coupon;
  if(c&&sub&&c.k==="pct")disc=Math.round(sub*c.v/100);
  const bon=S.useBonus?Math.min(S.bonus,Math.floor((sub-disc)*.3)):0;
  const del=S.co.del,base=del==="courier"?110:del==="branch"?70:60;
  const ship=!sub?0:(c&&c.k==="ship")||(sub>=1500&&del!=="courier")?0:base;
  const pre=sub-disc-bon+ship;
  pay=pay||S.co.pay;const codPart=pay==="cod"?pre:pay==="pre200"?Math.max(pre-200,0):0;
  const fee=codPart?Math.round(codPart*.02+20):0;
  return{sub,disc,bon,ship,fee,total:pre+fee,pre};
}

function setupCarousel(){
  const tr=$("#track"),hero=$("#hero");if(!tr)return;const dots=[...document.querySelectorAll("#dots i")],sl=[...tr.children];let idx=0,paused=false;
  const set=n=>{idx=n;sl.forEach((s,k)=>s.classList.toggle("on",k===n));dots.forEach((d,k)=>{d.classList.remove("on");void d.offsetWidth;if(k===n)d.classList.add("on")})};
  const restart=()=>{clearInterval(carT);if(!motion()||paused)return;carT=setInterval(()=>{const n=(idx+1)%sl.length;tr.scrollTo({left:n*tr.clientWidth,behavior:"smooth"});set(n)},4600)};
  let st;tr.addEventListener("scroll",()=>{clearTimeout(st);st=setTimeout(()=>{const n=Math.round(tr.scrollLeft/tr.clientWidth);if(n!==idx)set(n)},90)},{passive:true});
  let pt;hero.addEventListener("pointerdown",()=>{paused=true;hero.classList.add("paused");clearInterval(carT);clearTimeout(pt)});
  const resume=()=>{clearTimeout(pt);pt=setTimeout(()=>{paused=false;hero.classList.remove("paused");restart()},5000)};

  restart();
}

  if(e.target.id!=="co")return;e.preventDefault();keepForm();const co=S.co,err=t=>{$("#coErr").textContent=t};
  const ph=(co.phone||"").replace(/\D/g,"");
  if(!/^(380\d{9}|0\d{9})$/.test(ph)){err("Вкажіть номер у форматі +380 XX XXX XX XX");return}
  if(!(co.name||"").trim()){err("Вкажіть прізвище та ім'я отримувача");return}
  if(co.del==="courier"?!(co.addr||"").trim():!((co.city||"").trim()&&(co.wh||"").trim())){err("Вкажіть адресу доставки");return}
  if(!co.agree){err("Підтвердіть згоду з умовами оферти");return}
  const t=totals(),no="YL-"+(10000+hash(Date.now())%89999);
  const online=["gpay","card","parts"].includes(co.pay);
  if(t.bon)S.bonus-=t.bon;if(online)S.bonus+=50;
  S.orders.unshift({no,items:S.cart.map(x=>({...x})),total:t.total,status:0,fresh:true,ttn:"2045 "+String(1000+hash(no)%9000)+" "+String(1000+hash(no+"x")%9000)+" 78",code:String(100000+hash(no+"c")%899999),wh:co.del==="courier"?co.addr:co.wh});
  S.cart=[];S.coupon=null;S.useBonus=false;persistCart();save();count();S.ord=no;go("order");if(online)toast("+50 бонусів за онлайн-оплату");
});

/* ===== clocks, eco, network ===== */
function tickClock(){
  const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const c=$("#clock");
  if(c)c.innerHTML=hms(Math.floor((m-n)/1000)).map(x=>`<b>${x}</b>`).join("<span>:</span>");
  GROUPS.forEach((g,k)=>{g.left=Math.max(0,g.left-1);const el=document.querySelector(`[data-left="${k}"]`);if(el)el.textContent=hms(g.left).join(":")});
}
setInterval(tickClock,1000);
const setHH=()=>document.documentElement.style.setProperty("--hh",$("#hdr").offsetHeight+"px");
function applyEco(){document.documentElement.classList.toggle("eco",S.eco);$("#ecob").hidden=!S.eco;setHH()}
function netState(){const on=navigator.onLine!==false;$("#net").hidden=on;if(!on){const t=new Date();$("#netT").textContent=`Немає зв'язку. Показуємо збережене о ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`}setHH()}
addEventListener("online",netState);addEventListener("offline",netState);
try{new ResizeObserver(()=>{setHH();navInd();moveInd($("#ftabs"),".ft[aria-selected=true]",$("#find"))}).observe($("#hdr"))}catch(e){}

/* ===== onboarding ===== */
function onboarding(){
  if(!S.onb)return;
  $("#onbHost").innerHTML=`<div class="onb gut" role="dialog" aria-modal="true" aria-label="Ласкаво просимо до YULA"><div class="wrap">
    <div class="big">YULA<b></b></div>
    <div class="tag">Модні речі, які вже в Україні</div>
    <ul><li><i>${ic("truck")}</i>Речі вже в Україні, у поштоматі за 2–3 дні</li><li><i>${ic("ret")}</i>Повернення 14 днів через Нову пошту</li><li><i>${ic("eye")}</i>Справжні фото, розміри в сантиметрах і відгуки</li></ul>
    <div><div style="font-weight:800;margin-bottom:10px">Для кого шукаємо?</div><div class="who" id="who">${[["women","Жінкам"],["men","Чоловікам"],["kids","Дітям"],["all","Усім"]].map(([k,l])=>`<button type="button" data-who="${k}" aria-pressed="${k==="all"}">${l}</button>`).join("")}</div></div>
    <div class="gift">${ic("gift","width:28px;height:28px")}<div><b class="num">100 ₴</b><div style="font-size:13px;font-weight:600">на перше замовлення вже у профілі</div></div></div>
    <div class="juli"><span class="ya">Ю</span>Я Юля. Підберу розмір і підкажу, що пасує саме тобі.</div>
    <button class="btn block" type="button" id="onbGo">Почати покупки</button>
  </div></div>`;
  $("#who").onclick=e=>{const b=e.target.closest("[data-who]");if(!b)return;S.who=b.dataset.who;$("#who").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))};
  $("#onbGo").onclick=()=>{S.onb=false;save();const o=$(".onb");if(motion())o.animate([{opacity:1},{opacity:0,transform:"translateY(-20px)"}],{duration:280,easing:"ease-in"}).onfinish=()=>{$("#onbHost").innerHTML=""};else $("#onbHost").innerHTML="";
    if(S.who!=="all"){S.nt=S.who;document.querySelectorAll(".nt").forEach(x=>x.setAttribute("aria-selected",x.dataset.nt===S.nt));navInd()}render()};
}

applyEco();netState();setHH();count();
render();navInd();onboarding();
document.fonts&&document.fonts.ready.then(()=>{navInd();moveInd($("#ftabs"),".ft[aria-selected=true]",$("#find"));setHH()});
</script>

<style>
/*@@FIXEL@@*/
@font-face{font-family:"Fixel Text";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/FixelText-Regular.woff2") format("woff2")}
@font-face{font-family:"Fixel Text";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/FixelText-Medium.woff2") format("woff2")}
@font-face{font-family:"Fixel Text";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/FixelText-SemiBold.woff2") format("woff2")}
@font-face{font-family:"Fixel Text";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/FixelText-Bold.woff2") format("woff2")}
@font-face{font-family:"Fixel Text";font-weight:800;font-style:normal;font-display:swap;src:url("fonts/FixelText-ExtraBold.woff2") format("woff2")}
@font-face{font-family:"Fixel Display";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/FixelDisplay-Bold.woff2") format("woff2")}
@font-face{font-family:"Fixel Display";font-weight:800;font-style:normal;font-display:swap;src:url("fonts/FixelDisplay-ExtraBold.woff2") format("woff2")}
/*@@END@@*/
/* Layout: owner admin in the YULA system. Graphite header, milk ground, white work surfaces. Single column on phone, wider working column on laptop. Light-only like the shop. */
:root{
  --bg:#F7F4EF; --paper:#FFFFFF; --ink:#111111; --ink2:#2B2926; --muted:#6F6A64; --line:#E6E0D7; --soft:#EFEAE2;
  --pink:#FF2E7E; --pink-deep:#B8104F; --blush:#FFE9F1; --butter:#FFE14D;
  --green:#086B47; --green-soft:#E1F2E9; --amber:#9A5A00; --amber-soft:#FFF1D6; --red:#C21F3A; --red-soft:#FDE6EA;
  --f-d:"Fixel Display","Fixel Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-b:"Fixel Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --spring:cubic-bezier(.2,.9,.25,1.15);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-b);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mark,.ph,.kpi b,.stats b,.ord .top b,.prod .money b,.rrow b{font-feature-settings:"ss01"}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:820px;margin:0 auto;min-height:100vh;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;padding-block:12px;display:flex;align-items:center;gap:10px}
.mark{font:800 19px var(--f-d);letter-spacing:.14em;display:flex;align-items:center;gap:6px}
.mark b{width:8px;height:8px;background:var(--pink);clip-path:polygon(0 0,100% 0,100% 70%,70% 100%,0 100%)}
.hdr small{font-size:12px;font-weight:700;color:rgba(255,255,255,.65);border-left:1px solid rgba(255,255,255,.2);padding-left:10px}
.hdr .sp{flex:1}
.pub{background:var(--pink);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.pub .dot{width:8px;height:8px;border-radius:50%;background:var(--ink)}
.view{animation:vi .25s ease-out}
@keyframes vi{from{opacity:.4;transform:translateY(6px)}}
h1.ph{font:900 21px var(--f-d);letter-spacing:-.01em;margin:18px 0 4px}
.lead{color:var(--muted);margin:0 0 12px;font-size:14px;max-width:64ch}
.card{background:var(--paper);border-radius:16px;padding:14px;margin-top:12px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card h3 .r{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--muted)}
.btn{border-radius:12px;padding:12px 16px;font-weight:800;background:var(--ink);color:#fff;display:inline-flex;gap:6px;align-items:center;justify-content:center;min-height:46px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.pink{background:var(--pink);color:var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px;min-height:36px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{background:var(--soft);color:var(--muted);box-shadow:none;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--paper);border-radius:14px;padding:12px}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.kpi b{display:block;font:900 20px var(--f-d);margin-top:4px;letter-spacing:-.02em}
.kpi em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.mut{background:var(--soft);color:var(--ink2)}
.live{width:8px;height:8px;border-radius:50%;background:var(--green);animation:live 1.8s infinite}
@keyframes live{70%{box-shadow:0 0 0 7px rgba(11,127,85,0)}0%{box-shadow:0 0 0 0 rgba(11,127,85,.5)}}
.todo{display:flex;gap:12px;align-items:center;padding-block:11px;border-bottom:1px solid var(--line);width:100%}
.todo:last-child{border-bottom:0}
.todo .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.todo .tx{flex:1;min-width:0;font-size:14px}
.todo .tx small{display:block;color:var(--muted);font-size:12.5px}
.sup{display:flex;gap:12px;align-items:flex-start}
.sup .lg{width:44px;height:44px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font:900 12px var(--f-d);flex:none}
.sup .tx{flex:1;min-width:0}
.sup .tx b{font-size:15px}
.sup .tx small{display:block;color:var(--muted);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.stats div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font:800 15px var(--f-d)}
.stats small{font-size:11px;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fchips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-block:8px 2px}
.fchips::-webkit-scrollbar{display:none}
.fch{flex:none;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.fch[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.search{display:flex;gap:8px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;height:44px;margin-top:10px}
.search input{border:0;outline:0;background:transparent;font:inherit;flex:1;min-width:0;color:var(--ink)}
.prod{display:flex;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.prod:last-child{border-bottom:0}
.th{width:64px;height:80px;border-radius:10px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;background:radial-gradient(120% 85% at 50% 28%,hsl(var(--h) 35% 98%),hsl(var(--h) 22% 88%))}
.th svg{width:76%;height:76%}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--paper)}
.prod .tx{flex:1;min-width:0}
.prod .t{font-weight:700;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .raw{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod .s{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prod .money{font-size:13px;margin-top:4px}
.prod .money b{font:800 14px var(--f-d)}
.stk{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.stk span{font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--green-soft);color:var(--green)}
.stk span.z{background:var(--soft);color:var(--muted);text-decoration:line-through}
.stk span.low{background:var(--amber-soft);color:var(--amber)}
.iss{font-size:12px;color:var(--amber);font-weight:700;margin-top:5px;display:flex;gap:4px;align-items:flex-start}
.tg{position:relative;width:46px;height:28px;border-radius:999px;background:var(--line);flex:none;transition:background .2s;align-self:center}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--spring)}
.tg[aria-checked="true"]{background:var(--green)}
.tg[aria-checked="true"]::after{transform:translateX(18px)}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:10px}
label.f input,label.f select{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.drop{border:2px dashed var(--line);border-radius:16px;padding:22px 14px;text-align:center;background:var(--bg);display:block;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--ink);background:var(--paper)}
.drop b{display:block;font-size:15px;margin-top:6px}
.drop small{color:var(--muted);font-size:12.5px}
.err{color:var(--red);font-size:13px;font-weight:700;min-height:18px}
.rng{width:100%;accent-color:var(--ink)}
.rrow{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14px;margin-top:14px}
.rrow b{font:900 18px var(--f-d)}
.ctab{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.ctab th,.ctab td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.ctab th{font-size:12px;color:var(--muted);font-weight:700}
.ctab td:last-child,.ctab th:last-child{text-align:right}
.ctab input{width:76px;padding:7px 8px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);font:inherit;text-align:right}
.ex{background:var(--bg);border-radius:12px;padding:12px;margin-top:12px}
.sum{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}
.sum.t{font-weight:800;border-top:1px dashed var(--line);margin-top:6px;padding-top:8px}
.ord{padding-block:12px;border-bottom:1px solid var(--line)}
.ord:last-child{border-bottom:0}
.ord .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.ord .top b{font:800 14px var(--f-d)}
.ord .top .pill{margin-left:auto}
.msg{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px 12px;font:500 12.5px/1.5 ui-monospace,monospace;margin-top:8px}
.steps{display:flex;gap:4px;margin-top:8px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--ink)}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,820px);background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));z-index:25}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);position:relative;min-height:48px;justify-content:center}
.tab svg.i{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink);font-weight:800}
.cnt{position:absolute;top:0;left:calc(50% + 6px);background:var(--pink);color:var(--ink);font-size:10px;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.ov{position:fixed;inset:0;background:rgba(17,12,8,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sheet{background:var(--paper);width:min(100%,820px);max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding-top:12px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:upp .36s var(--spring);position:relative}
@keyframes upp{from{transform:translateY(40%)}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.prog{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--ink);border-radius:8px;transition:width .3s}
.report{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.report li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:8px 10px;border-radius:10px;background:var(--bg)}
.report li b{font-variant-numeric:tabular-nums}
.report li.w{background:var(--amber-soft)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:13px;font-weight:700;font-size:13.5px;z-index:90;max-width:calc(100% - 32px);text-align:center;animation:tt .3s var(--spring)}
@keyframes tt{from{transform:translate(-50%,16px);opacity:0}}
.note{font-size:11.5px;color:var(--muted);text-align:center;padding-block:16px}
.more{display:block;width:100%;text-align:center;padding:12px;font-weight:700;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

function parseFeedXML(text){
  const doc=new DOMParser().parseFromString(text,"text/xml");
  if(doc.querySelector("parsererror"))throw new Error("Файл не схожий на XML. Перевірте, що це вивантаження фіду (YML/XML).");
  const offers=[...doc.getElementsByTagName("offer")];if(!offers.length)throw new Error("У файлі немає товарів (тегів <offer>).");
  const tag=(o,t)=>{const e=o.getElementsByTagName(t)[0];return e?e.textContent.trim():""};
  const groups=new Map();let supplierTag=null;
  for(const c of doc.getElementsByTagName("category")){const m=(c.textContent||"").match(/@(\w+)/);if(m)supplierTag=m[1]}
  for(const o of offers){
    const sizeEl=[...o.getElementsByTagName("param")].find(p=>/размер|розмір|size/i.test(p.getAttribute("name")||""));
    const avail=(o.getAttribute("available")||tag(o,"available")||"true")!=="false";
    const rec={name:tag(o,"name")||tag(o,"model"),price:parseFloat(tag(o,"price"))||0,qty:parseInt(tag(o,"quantity_in_stock")||tag(o,"stock_quantity")||tag(o,"quantity")||(avail?"1":"0"))||0,avail,size:sizeEl?sizeEl.textContent.trim():"Один",code:tag(o,"vendorCode"),pics:[...o.getElementsByTagName("picture")].map(p=>p.textContent.trim())};
    const g=o.getAttribute("group_id")||o.getAttribute("id");if(!groups.has(g))groups.set(g,[]);groups.get(g).push(rec);
  }
  return {groups,offers:offers.length,supplierTag};
}

const r9=x=>Math.ceil(x/10)*10-1;
function priceOf(it){const R=ST.rules,pct=R.cat[it.sub]!=null&&R.cat[it.sub]!==""?+R.cat[it.sub]:R.pct;const p=r9(Math.max(it.cost*(1+pct/100),it.cost+(+R.min||0)));return{p,pct}}
const tot=it=>Object.values(it.sz).reduce((a,b)=>a+b,0);
function dupMap(){const m={},best={};for(const it of ST.items){const k=it.n.toLowerCase().replace(/\s+/g," ");(m[k]=m[k]||[]).push(it)}
  for(const k in m){if(m[k].length<2)continue;const arr=m[k].filter(i=>tot(i)>0).sort((a,b)=>a.cost-b.cost);const w=arr[0]||m[k][0];for(const i of m[k])if(i!==w)best[i.gid]=w}return best}
function issues(it,dups){const a=[];if(!tot(it))a.push(["bad","Немає в наявності"]);if(dups[it.gid])a.push(["dup",`Дубль: дешевше у ${ST.sup[dups[it.gid].sl].n}`]);if(it.pics<2)a.push(["warn","Мало фото"]);if(!it.colorOk)a.push(["warn","Колір не розпізнано"]);if(it.sub==="Інше")a.push(["warn","Категорію не визначено"]);if(!it.mat)a.push(["info","Тканина невідома"]);return a}
function status(it,dups){if(ST.hide[it.gid]===true)return"hidden";if(ST.hide[it.gid]===false)return tot(it)?"live":"hidden";const is=issues(it,dups);if(is.some(x=>x[0]==="bad"||x[0]==="dup"))return"hidden";if(is.some(x=>x[0]==="warn"))return"review";return"live"}
function counts(){const d=dupMap(),c={all:0,live:0,review:0,hidden:0};for(const it of ST.items){c.all++;c[status(it,d)]++}return c}

const PROXY=[["https://backend.mydrop.com.ua/vendor/api/export/","/feed-proxy/mydrop/"],["https://my.prom.ua/","/feed-proxy/prom/"]];
function proxify(u){for(const [from,to] of PROXY)if(u.startsWith(from))return to+u.slice(from.length);return null}
async function fetchFeed(u){
  if(!/^https:\/\//.test(u))throw new Error("Посилання має починатися з https://");
  const p=proxify(u),tries=[];if(p&&/^https?:$/.test(location.protocol))tries.push(p);tries.push(u);let last=null;
  for(const t of tries){try{const r=await fetch(t,{cache:"no-store"});if(!r.ok)throw new Error("сервер постачальника відповів "+r.status);const tx=await r.text();if(!/<offer[\s>]/.test(tx))throw new Error("за посиланням немає товарів");return tx}catch(e){last=e}}
  if(!p)throw new Error("Цей сайт не віддає фід браузеру. Зараз підтримуються посилання MyDrop і Prom, або завантаж файл.");
  throw new Error("Не вдалося завантажити фід ("+(last&&last.message||"немає зв’язку")+"). На вашому сервері це працює через проксі YULA, у превью Claude — ні.");
}
function mergeImport(text,k,meta){
  const {groups,offers,supplierTag}=parseFeedXML(text);
  const isNew=k==null,sl=isNew?ST.sup.length:k,items=normalizeOffers(groups,sl);let added=0,updated=0,gone=0;
  if(!isNew){const s=ST.sup[k],old=new Map(ST.items.filter(i=>i.sl===sl).map(i=>[i.n+"|"+i.code,i])),keep=ST.items.filter(i=>i.sl!==sl),next=[];
    for(const it of items){const key=it.n+"|"+it.code,o=old.get(key);if(o){it.gid=o.gid;it.added=o.added;updated++;old.delete(key)}else added++;next.push(it)}
    for(const o of old.values()){o.sz=Object.fromEntries(Object.keys(o.sz).map(z=>[z,0]));next.push(o);gone++}
    ST.items=keep.concat(next);s.offers=offers;s.last=now();Object.assign(s,meta||{})}
  else{ST.sup.push(Object.assign({lg:(meta.n||"").replace(/[^\p{L}\p{N}]/gu,"").slice(0,2).toUpperCase()||"??",offers,last:now()},meta,{contact:meta.contact||(supplierTag?"@"+supplierTag:"")}));ST.items=ST.items.concat(items);added=items.length}
  ST.dirty=true;save();updBadges();
  return {sl,offers,groups:groups.size,added,updated,gone,isNew};
}
function reportHtml(r){
  const d=dupMap(),mine=ST.items.filter(i=>i.sl===r.sl),stat={live:0,review:0,hidden:0};for(const it of mine)stat[status(it,d)]++;
  const noColor=mine.filter(i=>!i.colorOk).length,few=mine.filter(i=>i.pics<2).length,dups=mine.filter(i=>d[i.gid]).length,nostock=mine.filter(i=>!tot(i)).length;
  return `<ul class="report"><li><span>Позицій у фіді</span><b>${r.offers}</b></li><li><span>Моделей після групування</span><b>${r.groups}</b></li>${r.isNew?"":`<li><span>Нових / оновлено / зникло з фіду</span><b>${r.added} / ${r.updated} / ${r.gone}</b></li>`}
    <li><span>Одразу на сайт</span><b>${stat.live}</b></li><li class="${stat.review?"w":""}"><span>На перевірку</span><b>${stat.review}</b></li><li><span>Приховано: немає в наявності або дубль</span><b>${stat.hidden}</b></li>
    ${noColor?`<li class="w"><span>Колір не розпізнано</span><b>${noColor}</b></li>`:""}${few?`<li class="w"><span>Менше 2 фото</span><b>${few}</b></li>`:""}${dups?`<li><span>Дублі з іншими постачальниками</span><b>${dups}</b></li>`:""}${nostock?`<li><span>Без залишків</span><b>${nostock}</b></li>`:""}</ul>`;
}
async function syncSup(k,silent){
  const s=ST.sup[k];if(!s||!s.url)return;
  const btn=document.querySelector(`[data-syncurl="${k}"]`);if(btn){btn.disabled=true;btn.lastChild.textContent="Оновлюємо…"}
  try{const r=mergeImport(await fetchFeed(s.url),k,{});if(!silent||r.added||r.gone)toast(`${s.n}: нових ${r.added}, оновлено ${r.updated}, зникло ${r.gone}`);render()}
  catch(e){s.err=e.message;save();if(!silent)toast(e.message);render()}
}
function addSupSheet(refresh){
  const s=refresh!=null?ST.sup[refresh]:null;
  sheet(`<div class="grab"></div><h1 class="ph" style="margin-top:0">${s?"Оновити "+s.n:"Новий постачальник"}</h1>
   <p class="lead">Встав посилання на вивантаження (MyDrop, Prom) або завантаж файл XML/YML. За посиланням товари й залишки оновлюватимуться самі.</p>
   <form id="sf" novalidate>
   ${s?"":`<label class="f" for="sName">Назва постачальника<input id="sName" placeholder="Наприклад, Knit UA" autocomplete="off"></label>`}
   <label class="f" for="sUrl">Посилання на фід<input id="sUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://backend.mydrop.com.ua/vendor/api/export/…" value="${s&&s.url?s.url.replace(/"/g,"&quot;"):""}"></label>
   <div style="text-align:center;color:var(--muted);font-size:12.5px;margin:-2px 0 8px">або файл</div>
   <label class="drop" id="drop" for="sFile">${ic("up","width:26px;height:26px")}<b id="dropT">Обери файл фіду</b><small>.xml або .yml · або перетягни сюди</small><input type="file" id="sFile" accept=".xml,.yml,text/xml" hidden></label>
   ${s?"":`<label class="f" for="sContact" style="margin-top:12px">Контакт менеджера<input id="sContact" placeholder="@manager у Telegram" autocomplete="off"></label>
   <label class="f" for="sPay">Як рахуєтесь<select id="sPay"><option>Оплата при отриманні на постачальника, він переводить різницю</option><option>Передплата постачальнику</option><option>Обидва варіанти</option></select></label>
   <label class="f" for="sRet">Повернення<input id="sRet" placeholder="Наприклад, 14 днів, обмін безкоштовно" autocomplete="off"></label>`}
   <div class="err" id="sErr" role="alert"></div><div id="sRes"></div>
   <button class="btn pink block" type="submit" id="sGo">Імпортувати</button></form>`);
  const drop=$("#drop"),fi=$("#sFile");let file=null;
  const setF=f=>{file=f;$("#dropT").textContent=f?f.name+" · "+Math.round(f.size/1024)+" КБ":"Обери файл фіду"};
  fi.onchange=()=>setF(fi.files[0]);
  ["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
  drop.addEventListener("drop",e=>{if(e.dataTransfer.files[0])setF(e.dataTransfer.files[0])});
  $("#sf").addEventListener("submit",async e=>{e.preventDefault();$("#sErr").textContent="";
    const name=s?s.n:$("#sName").value.trim(),url=$("#sUrl").value.trim();
    if(!name){$("#sErr").textContent="Як називається постачальник?";return}
    if(!file&&!url){$("#sErr").textContent="Встав посилання або обери файл";return}
    const btn=$("#sGo");btn.disabled=true;btn.textContent=file?"Розбираємо файл…":"Завантажуємо фід…";
    try{
      const text=file?await file.text():await fetchFeed(url);
      const meta=s?(file?{file:file.name}:{url,src:"Фід за посиланням",file:"",err:""}):{n:name,src:file?"XML-файл":"Фід за посиланням",file:file?file.name:"",url:file?"":url,contact:$("#sContact").value.trim(),pay:$("#sPay").value,ret:$("#sRet").value.trim()||"Уточнити умови повернення"};
      const r=mergeImport(text,s?refresh:null,meta);
      $("#sRes").innerHTML=reportHtml(r);
      btn.outerHTML=`<div class="acts"><button class="btn" type="button" data-supitems="${r.sl}" style="flex:1">Переглянути товари</button><button class="btn pink" type="button" data-publish style="flex:1">${ic("send","width:16px;height:16px")}Опублікувати</button></div>`;
      render();
    }catch(err){$("#sErr").textContent=err.message||"Не вдалося прочитати фід";btn.disabled=false;btn.textContent="Імпортувати"}
  });
}

/* ===== publish ===== */
function publish(){
  const d=dupMap(),live=ST.items.filter(i=>status(i,d)==="live");
  if(!live.length){toast("Немає товарів для публікації");return}
  const items=live.map(it=>{const pr=priceOf(it);return{n:it.n,raw:it.raw,s:it.s,sub:it.sub,c:it.c,h:it.h,sat:it.sat,l:it.l,pat:it.pat,cost:it.cost,p:pr.p,sz:it.sz,pics:it.pics,ph:it.ph,mat:it.mat,code:it.code,sl:it.sl}});
  const pub={at:now(),suppliers:ST.sup.map(s=>({n:s.n,lg:s.lg,legal:"Постачальник · реквізити уточнюються",city:"Україна",r:null,on:null,since:new Date().getFullYear(),vf:0})),items};
  try{localStorage.setItem(PUB,JSON.stringify(pub));ST.published=now();ST.dirty=false;save();updBadges();
    sheet(`<div class="grab"></div><div style="text-align:center;padding-top:16px"><div style="width:70px;height:70px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:0 auto">${ic("chk","width:34px;height:34px;stroke-width:2.6")}</div>
     <h1 class="ph">Опубліковано ${items.length} товарів</h1><p class="lead" style="margin-inline:auto">Сайт на цьому ж адресі вже показує новий каталог у вашому браузері. У робочій версії публікація оновлюватиме сайт для всіх.</p>
     <a class="btn pink block" href="index.html" style="text-decoration:none;margin-top:6px">Відкрити сайт</a>
     <button class="btn soft block" type="button" data-unpub style="margin-top:8px">Повернути вбудований каталог</button></div>`);render()}
  catch(e){toast("Каталог завеликий для сховища браузера. У робочій версії він зберігатиметься на сервері.")}
}

/* ===== render & events ===== */
function updBadges(){const c=counts(),r=$("#rcnt"),o=$("#ocnt"),n=ST.orders.filter(x=>x.st===0).length;r.textContent=c.review;r.hidden=!c.review;o.textContent=n;o.hidden=!n;$("#pubDot").hidden=!ST.dirty}
function render(){$("#main").innerHTML={home:vHome,sup:vSup,items:vItems,rules:vRules,orders:vOrders}[S.view]();document.querySelectorAll(".tab").forEach(t=>t.dataset.go===S.view?t.setAttribute("aria-current","page"):t.removeAttribute("aria-current"));updBadges();bindView()}
function go(v){S.view=v;S.lim=40;render();scrollTo({top:0})}
function bindView(){
  const q=$("#q");if(q){q.oninput=()=>{S.q=q.value;S.lim=40;const pos=q.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)}}
  const ss=$("#supSel");if(ss)ss.onchange=()=>{S.sup=ss.value;render()};
  if(S.view==="rules"){
    const upd=()=>{const R=ST.rules;R.pct=+$("#rPct").value;R.min=+$("#rMin").value;$("#vPct").textContent=R.pct+"%";$("#vMin").textContent=R.min+" ₴";
      $("#ex").innerHTML=exHtml([150,250,400,700].map(c=>[c,priceOf({cost:c,sub:"__"}).p]));
      const d=dupMap(),live=ST.items.filter(i=>status(i,d)==="live"),m=live.length?live.reduce((a,i)=>a+(priceOf(i).p-i.cost),0)/live.length:0;
      $("#avgM").style.color=m<80?"var(--red)":"var(--muted)";$("#avgM").innerHTML=`Середній заробіток з речі на сайті: <b class="num">${uah(m)}</b>${m<80?" — цього замало, щоб окупити рекламу в Instagram":""}`;
      document.querySelectorAll("[data-cat]").forEach(i=>i.placeholder=R.pct);ST.dirty=true;updBadges()};
    ["rPct","rMin"].forEach(id=>{$("#"+id).oninput=upd;$("#"+id).onchange=save});
    document.querySelectorAll("[data-cat]").forEach(inp=>inp.onchange=()=>{const v=inp.value.trim();if(v==="")delete ST.rules.cat[inp.dataset.cat];else ST.rules.cat[inp.dataset.cat]=Math.max(0,+v);ST.dirty=true;save();updBadges();toast(`Націнка для «${inp.dataset.cat}»: ${v===""?"загальна":v+"%"}`)});
  }
}
document.addEventListener("click",e=>{
  const T=s=>e.target.closest(s);let b;
  if(T("[data-close]")||e.target.id==="ov"){closeSheet();return}
  if(b=T("[data-go]")){closeSheet();go(b.dataset.go);return}
  if(T("[data-publish]")){publish();return}
  if(T("[data-unpub]")){try{localStorage.removeItem(PUB)}catch(x){}ST.dirty=true;save();closeSheet();render();toast("Сайт знову показує вбудований каталог");return}
  if(T("[data-addsup]")){addSupSheet();return}
  if(b=T("[data-filter]")){S.f=b.dataset.filter;S.lim=40;if(S.view!=="items")S.view="items";render();return}
  if(b=T("[data-syncurl]")){syncSup(+b.dataset.syncurl,false);return}
  if(b=T("[data-editsup]")){addSupSheet(+b.dataset.editsup);return}
  if(b=T("[data-supitems]")){closeSheet();S.sup=b.dataset.supitems;S.f="all";go("items");return}
  if(b=T("[data-delsup]")){const k=+b.dataset.delsup;const n=ST.sup[k].n;ST.items=ST.items.filter(i=>i.sl!==k).map(i=>i.sl>k?{...i,sl:i.sl-1}:i);ST.sup.splice(k,1);ST.dirty=true;save();render();toast(`Постачальника ${n} видалено`);return}
  if(b=T("[data-toggle]")){const id=b.dataset.toggle,it=ST.items.find(i=>i.gid===id);const on=b.getAttribute("aria-checked")!=="true";if(on&&!tot(it)){toast("Немає в наявності — не можна показати");return}ST.hide[id]=!on;ST.dirty=true;save();b.setAttribute("aria-checked",on);updBadges();return}
  if(T("[data-approveall]")){const d=dupMap();ST.items.filter(i=>status(i,d)==="review"&&(S.sup==="all"||i.sl===+S.sup)).forEach(i=>ST.hide[i.gid]=false);ST.dirty=true;save();render();toast("Товари з перевірки показуються на сайті");return}
  if(T("[data-more]")){S.lim+=40;render();return}
  if(b=T("[data-copyorder]")){const t=orderMsg(ST.orders[+b.dataset.copyorder]);try{navigator.clipboard.writeText(t).then(()=>toast("Скопійовано — надішліть менеджеру в Telegram"),()=>toast("Виділіть текст і скопіюйте вручну"))}catch(x){toast("Виділіть текст і скопіюйте вручну")}return}
  if(b=T("[data-ost]")){const o=ST.orders[+b.dataset.ost];o.st=Math.min(3,o.st+1);save();render();return}
});
document.addEventListener("change",e=>{const r=e.target.closest("[data-refresh]");if(r&&r.files[0]){const k=+r.dataset.refresh;addSupSheet(k);const dt=new DataTransfer();dt.items.add(r.files[0]);const fi=$("#sFile");fi.files=dt.files;fi.dispatchEvent(new Event("change"));}});
document.addEventListener("submit",e=>{const f=e.target.closest("[data-ttn]");if(!f)return;e.preventDefault();const k=+f.dataset.ttn,v=f.querySelector("input").value.replace(/\D/g,"");if(v.length!==14){toast("ТТН має містити 14 цифр");return}const o=ST.orders[k];o.ttn=v.replace(/(\d{4})(\d{4})(\d{4})(\d{2})/,"$1 $2 $3 $4");o.st=2;save();render();toast("ТТН збережено, покупець отримає SMS")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
render();
ST.sup.forEach((sp,k)=>{if(sp.url&&now()-sp.last>30*60e3)syncSup(k,true)});
</script>
